name: Activated-carbon confirmation experiment proposal

on:
  push:
    branches: [main]
    paths:
      - "carbon_materials_process_quality/03_confirmation_plan/design_experiment.py"
      - "carbon_materials_process_quality/analyze.py"
      - "carbon_materials_process_quality/requirements.txt"
      - "tests/test_carbon_confirmation_plan.py"
      - ".github/workflows/carbon_confirmation_plan.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reproduce-proposed-design:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install analysis dependencies
        run: python -m pip install -r carbon_materials_process_quality/requirements.txt
      - name: Fetch verified original data and generate proposed trial matrix
        run: python carbon_materials_process_quality/03_confirmation_plan/design_experiment.py
      - name: Validate cohort support, balance, and no fabricated measurements
        run: python -m unittest discover -s tests -p "test_carbon_confirmation_plan.py" -v
      - name: Check no original source data is distributed
        run: |
          test ! -e carbon_materials_process_quality/mast3rboost-AC-UON.csv
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path("carbon_materials_process_quality/03_confirmation_plan/results")
          report = json.loads((root / "DESIGN_EVIDENCE.json").read_text("utf-8"))
          assert report["stage"] == "NOT_EXECUTED_EXPERIMENT_PROPOSAL"
          assert report["preparation_runs"] == 12
          with (root / "MEASUREMENT_LOG_TEMPLATE.csv").open(encoding="utf-8") as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == 12
          assert all(r["run_status"] == "NOT_RUN" for r in rows)
          assert all(r["BET_measurement_1_m2_g"] == "" for r in rows)
          PY
      - name: Publish only derived proposal templates and evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f carbon_materials_process_quality/03_confirmation_plan/results/DESIGN_MATRIX.csv
          git add -f carbon_materials_process_quality/03_confirmation_plan/results/MEASUREMENT_LOG_TEMPLATE.csv
          git add -f carbon_materials_process_quality/03_confirmation_plan/results/DESIGN_EVIDENCE.json
          if git diff --cached --quiet; then
            echo "Proposed design is already published and unchanged."
          else
            git commit -m "Publish reproducible unexecuted carbon confirmation experiment plan"
            git pull --rebase origin main
            git push
          fi
