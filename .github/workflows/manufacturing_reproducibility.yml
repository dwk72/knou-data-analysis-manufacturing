name: Manufacturing data reproducibility

on:
  push:
    branches: [main]
    paths:
      - "07_manufacturing_extension/**"
      - "tests/test_manufacturing_reproducibility.py"
      - ".github/workflows/manufacturing_reproducibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manufacturing-reproduction:
    runs-on: ubuntu-latest
    steps:
      - name: Check out published project
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned data dependency
        run: python -m pip install "pandas==2.2.3"
      - name: Run isolated generator and data-integration reproduction
        run: python -m unittest discover -s tests -p "test_manufacturing_*.py" -v
