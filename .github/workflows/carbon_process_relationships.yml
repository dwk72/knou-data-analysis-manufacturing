name: Carbon activation and composition analysis

on:
  push:
    branches: [main]
    paths:
      - "carbon_materials_process_quality/02_process_relationships/analyze_relationships.py"
      - "carbon_materials_process_quality/analyze.py"
      - "carbon_materials_process_quality/requirements.txt"
      - "tests/test_carbon_process_relationships.py"
      - ".github/workflows/carbon_process_relationships.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  carbon-process-associations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the existing carbon-analysis environment
        run: python -m pip install -r carbon_materials_process_quality/requirements.txt
      - name: Download official data and generate cohort-aware analysis
        run: python carbon_materials_process_quality/02_process_relationships/analyze_relationships.py
      - name: Run independent checks of data grain and modeling assumptions
        run: python -m unittest discover -s tests -p "test_carbon_process_relationships.py" -v
      - name: Check that only derived non-row-level artifacts are tracked
        run: |
          test ! -e carbon_materials_process_quality/mast3rboost-AC-UON.csv
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("carbon_materials_process_quality/02_process_relationships/results/summary.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          assert d["literature"]["primary_n"] == 162
          assert d["MAST3RBoost"]["temperature_effect_estimable"] is False
          assert d["MAST3RBoost"]["n"] == 49
          PY
      - name: Commit reports and derived charts only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add carbon_materials_process_quality/02_process_relationships/results/REPORT.md
          git add -f carbon_materials_process_quality/02_process_relationships/results/summary.json
          git add carbon_materials_process_quality/02_process_relationships/results/figures/*.svg
          if git diff --cached --quiet; then
            echo "No derived output changes."
          else
            git commit -m "Publish separated carbon-materials process and composition results"
            git push
          fi
